AWSTemplateFormatVersion: '2010-09-09'
Description: >
  WAF v2 + CloudFront for XOC API (prod only).
  Deploy standalone with:
    aws cloudformation deploy --template-file infra/waf-cloudfront-prod.yml --stack-name xoc-infra-waf-cloudfront-prod --parameter-overrides ApiGatewayEndpoint=https://<id>.execute-api.us-east-1.amazonaws.com --region us-east-1 --capabilities CAPABILITY_IAM

Parameters:
  ApiGatewayEndpoint:
    Type: String
    Description: Full API Gateway HTTP API endpoint (e.g. https://abc123.execute-api.us-east-1.amazonaws.com)
    AllowedPattern: '^https://[a-z0-9]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com$'
  RateLimitPer5Min:
    Type: Number
    Default: 2000
    Description: Max requests per IP every 5 minutes
    MinValue: 100
    MaxValue: 200000

Resources:
  # ---------- WAF ----------
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: xoc-api-prod-rate-limit
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: xoc-api-prod-rate-limit
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Min
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIP
        - Name: BlockIran
          Priority: 1
          Statement:
            GeoMatchStatement:
              CountryCodes: [IR]
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: BlockIran

  # ---------- CloudFront ----------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: XOC API – WAF protected endpoint
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        WebACLId: !GetAtt WebACL.Arn

        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Select [2, !Split ['/', !Ref ApiGatewayEndpoint]]
            OriginPath: !Select [3, !Split ['/', !Ref ApiGatewayEndpoint]]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5

        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewer
          Compress: true

        CustomErrorResponses: []

Outputs:
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  WebACLArn:
    Value: !GetAtt WebACL.Arn
  FullURL:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
