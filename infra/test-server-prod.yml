AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  XOC test lab host. EC2 Ubuntu instance that runs VICTOR on-premise (server +
  executor) and holds simulated malicious files, so plans execute against this
  isolated lab target. SSM access means no local SSH/VPN is required.

Parameters:
  InstanceName:
    Type: String
    Default: xoc-test-target
    Description: Nombre/tag de la instancia.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC donde vive VICTOR (prod usa xoc-prod-vpc 10.20.0.0/16).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred publica (prod usa xoc-prod-public-a 10.20.0.0/24) para tener IP publica y salida a internet/SSM.

  KeyName:
    Type: String
    Default: ''
    Description: (Opcional) Key pair existente solo si vas a usar SSH. Vacio = acceso exclusivamente por SSM.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]
    Description: Tipo de instancia.

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: AMI Ubuntu 24.04 LTS por defecto (resuelta por SSM). Se ignora si defines CustomAmiId.

  CustomAmiId:
    Type: String
    Default: ''
    Description: (Opcional) AMI ID propia, por ejemplo tu "Cloud 9 Ubuntu22" (ami-xxxxxxxx). Vacio = usa AmiId.

  VictorCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR permitido hacia VICTOR :8000 e ICMP (red de las Lambdas/VPC).

  SshCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR permitido hacia SSH :22. Pon tu IP publica /32 si vas a entrar por SSH desde fuera.

  AllocateElasticIp:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Asignar IP publica fija (EIP) a la instancia.

  BootstrapScriptUrl:
    Type: String
    Default: https://raw.githubusercontent.com/steve-ricapa/XOC-API-AWS/main/scripts/bootstrap-victor-lab.sh
    Description: Script que instala Docker, siembra artefactos y levanta VICTOR.

  SeedScriptUrl:
    Type: String
    Default: https://raw.githubusercontent.com/steve-ricapa/XOC-API-AWS/main/scripts/test-server-seed.sh
    Description: Script de artefactos simulados. Si falla, el bootstrap crea un seed minimo.

  InstallVictor:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'Instalar VICTOR on-premise (docker compose: victor-server + executor) en esta instancia.'

  VictorRepoUrl:
    Type: String
    Default: https://github.com/steve-ricapa/VICTOR-XOC-ClaudeC.git
    Description: Repo publico de VICTOR on-premise.

  VictorRepoRef:
    Type: String
    Default: main
    Description: Rama/tag de VICTOR a desplegar.

  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key de Azure AI Foundry/Anthropic. Se escribe en /opt/victor/.env (chmod 600). Puedes dejarla vacia y completarla luego por SSM.

  AzureEndpoint:
    Type: String
    Default: https://aoai-sophia-xoc-eus2.services.ai.azure.com/anthropic
    Description: Endpoint Azure AI Foundry para Claude.

  AnthropicModel:
    Type: String
    Default: claude-sonnet-4-6
    Description: Modelo Claude.

  AzureDeployment:
    Type: String
    Default: claude-sonnet-4-6
    Description: Nombre del deployment en Azure AI Foundry.

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, '']]
  HasCustomAmi: !Not [!Equals [!Ref CustomAmiId, '']]
  CreateEip: !Equals [!Ref AllocateElasticIp, 'true']

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${InstanceName}-role'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: XOC test lab - SSM, VICTOR reachability, optional SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: SSH desde el CIDR configurado (tu IP /32 o la VPC)
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref VictorCidr
          Description: API VICTOR (Lambdas XOC en la VPC) - sin auth, solo red interna
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: !Ref VictorCidr
          Description: ICMP desde red VICTOR/on-prem
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Salida para SSM, apt y descarga del seed
      Tags:
        - Key: Name
          Value: !Sub '${InstanceName}-sg'
        - Key: xoc:role
          Value: test-target

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [HasCustomAmi, !Ref CustomAmiId, !Ref AmiId]
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyName, !Ref 'AWS::NoValue']
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: xoc:role
          Value: test-target
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee -a /var/log/xoc-test-bootstrap.log) 2>&1

            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y curl ca-certificates
            mkdir -p /opt/xoc-test

            curl -fsSL --retry 3 --connect-timeout 10 "${BootstrapUrl}" -o /opt/xoc-test/bootstrap.sh
            chmod +x /opt/xoc-test/bootstrap.sh

            set +x
            cat > /opt/xoc-lab-bootstrap.env <<'EOF_ENV'
            ANTHROPIC_API_KEY=${AnthropicApiKey}
            ANTHROPIC_MODEL=${AnthropicModel}
            AZURE_ENDPOINT=${AzureEndpoint}
            AZURE_DEPLOYMENT=${AzureDeployment}
            INSTALL_VICTOR=${InstallVictor}
            SWAP_SIZE=2G
            VICTOR_REPO_URL=${VictorRepoUrl}
            VICTOR_REPO_REF=${VictorRepoRef}
            SEED_SCRIPT_URL=${SeedUrl}
            EOF_ENV
            chmod 600 /opt/xoc-lab-bootstrap.env
            set -a
            . /opt/xoc-lab-bootstrap.env
            set +a
            set -x

            /opt/xoc-test/bootstrap.sh
          - BootstrapUrl: !Ref BootstrapScriptUrl
            SeedUrl: !Ref SeedScriptUrl
            InstallVictor: !Ref InstallVictor
            VictorRepoUrl: !Ref VictorRepoUrl
            VictorRepoRef: !Ref VictorRepoRef
            AnthropicApiKey: !Ref AnthropicApiKey
            AzureEndpoint: !Ref AzureEndpoint
            AnthropicModel: !Ref AnthropicModel
            AzureDeployment: !Ref AzureDeployment

  ElasticIp:
    Type: AWS::EC2::EIP
    Condition: CreateEip
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: Name
          Value: !Sub '${InstanceName}-eip'

Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  PublicIp:
    Value: !If [CreateEip, !Ref ElasticIp, !GetAtt Instance.PublicIp]
  SsmTargetTag:
    Value: 'xoc:role=test-target'
  VictorBaseUrl:
    Description: URL privada de VICTOR para runtime settings del tenant (Lambda -> EC2).
    Value: !Sub 'http://${Instance.PrivateIp}:8000'
  VictorHealthUrl:
    Description: Health check desde la propia instancia o desde la VPC.
    Value: !Sub 'http://${Instance.PrivateIp}:8000/health'
  SsmTailVictorLogsCommand:
    Description: Ver logs del bootstrap y de docker desde CloudShell.
    Value: !Sub >-
      aws ssm send-command --document-name AWS-RunShellScript
      --targets "Key=tag:xoc:role,Values=test-target"
      --comment "xoc-victor-logs"
      --parameters '{"commands":["sudo tail -n 80 /var/log/xoc-test-bootstrap.log","cd /opt/victor && sudo docker compose ps && sudo docker compose logs --tail=80 victor-server executor"]}'
      --region ${AWS::Region}
      --query Command.CommandId --output text
  SsmRunSeedCommand:
    Description: Re-ejecutar el seed de artefactos desde AWS CloudShell (sin SSH).
    Value: !Sub >-
      aws ssm send-command --document-name AWS-RunShellScript
      --targets "Key=tag:xoc:role,Values=test-target"
      --comment "xoc-test-seed"
      --parameters '{"commands":["sudo curl -fsSL https://raw.githubusercontent.com/steve-ricapa/XOC-API-AWS/main/scripts/test-server-seed.sh -o /tmp/xoc-seed.sh && sudo bash /tmp/xoc-seed.sh"]}'
      --region ${AWS::Region}
      --query Command.CommandId --output text
